[project]
name = "baba-is-agent"
version = "0.3.0"
description = "Play the Linux Steam version of Baba Is You through MCP, without screenshots."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "V9EQ" }]
keywords = ["mcp", "baba-is-you", "game-agent", "steam"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Puzzle Games",
]
dependencies = [
    "evdev>=1.9,<2; sys_platform == 'linux'",
    "mcp>=1.12,<2",
    "pydantic>=2.11,<3",
]

[project.scripts]
baba-mcp = "baba_is_agent.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.14,<1",
    "ty>=0.0.98",
]

[tool.hatch.build.targets.wheel]
packages = ["src/baba_is_agent"]

[tool.ruff]
line-length = 99
target-version = "py313"
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["baba_is_agent"]

[tool.coverage.report]
show_missing = true
